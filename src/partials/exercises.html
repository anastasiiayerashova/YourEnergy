<section class="section-exercises">
  <div class="exercises-container">
    <h2 class="title">Exercises</h2>
    <div class="buttons">
      <ul class="buttons-list">
        <li>
          <button class="exercises-btn">Muscles</button>
        </li>
        <li>
          <button class="exercises-btn">Body parts</button>
        </li>
        <li>
          <button class="exercises-btn">Equipment</button>
        </li>
      </ul>
    </div>
  </div>

  <div class="main-container">
    <div class="quote-container">
      <ul class="quote-list">
        <li class="quote-item">
          <div class="running-man-icon-circle">
            <svg width="18" height="20" class="running-man-icon">
              <use href="./img/sprite.svg#running-man-icon"></use>
            </svg>
          </div>
          <div class="quote-author-container">
            <h3 class="quote-title">Quote of the day</h3>
            <p class="quote-text"></p>
            <p class="quote-author"></p>
          </div>
          <svg width="20" height="20" class="inverted-commas-icon">
            <use href="./img/sprite.svg#inverted-commas-icon"></use>
          </svg>
        </li>
        <li class="quote-item-second">
          <picture class="quote-item-img">
            <source
              media="(max-width: 767px)"
              srcset="
                ./img/quote-img-mob@1x.jpg 1x,
                ./img/quote-img-mob@2x.jpg 2x
              "
            />
            <source
              media="(min-width: 768px) and (max-width: 1439px)"
              srcset="
                ./img/quote-img-tab@1x.jpg 1x,
                ./img/quote-img-tab@2x.jpg 2x
              "
            />
            <source
              media="(min-width: 1440px)"
              srcset="
                ./img/quote-img-desk@1x.jpg 1x,
                ./img/quote-img-desk@2x.jpg 2x
              "
            />
            <img src="./img/quote-img-mob@1x.jpg" alt="Fitness" />
          </picture>
        </li>
        <li class="quote-item-third"></li>
      </ul>
    </div>
    <div class="filters-container"></div>
  </div>
</section>

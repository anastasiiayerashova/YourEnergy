<section class="section-favorites">
  <div class="container">
    <h2 class="title-favorites">Favorites</h2>
    <div class="favorites-main-container">
      <div class="favorites-first-container">
        <div class="favorites-quote-container">
          <ul class="favorites-quote-list">
            <li class="favorites-quote-item">
              <div class="favorites-running-man-icon-circle">
                <svg width="18" height="20" class="favorites-running-man-icon">
                  <use href="./img/sprite.svg#running-man-icon"></use>
                </svg>
              </div>
              <div class="favorites-quote-author-container">
                <h3 class="favorites-quote-title">Quote of the day</h3>
                <p class="quote-text favorites-quote-text"></p>
                <p class="quote-author favorites-quote-author"></p>
              </div>
              <svg
                width="20"
                height="20"
                class="favorites-inverted-commas-icon"
              >
                <use href="./img/sprite.svg#inverted-commas-icon"></use>
              </svg>
            </li>
            <li class="favorites-quote-item-third">
              <svg width="20" height="20" class="favorites-gym-icon">
                <use href="./img/sprite.svg#gym-icon"></use>
              </svg>

              <div class="favorites-quote-item-third-container">
                <p class="favorites-quote-item-third-number">110 min</p>
                <p class="favorites-quote-item-third-subtitle">
                  Daily norm of sports
                </p>
              </div>
            </li>
            <li class="favorites-quote-item-second">
              <picture class="favorites-quote-item-img">
                <source
                  media="(max-width: 767px)"
                  srcset="
                    ./img/favorites-img-mob@1x.jpg 1x,
                    ./img/favorites-img-mob@2x.jpg 2x
                  "
                />
                <source
                  media="(min-width: 768px) and (max-width: 1439px)"
                  srcset="
                    ./img/favorites-img-tab@1x.jpg 1x,
                    ./img/favorites-img-tab@2x.jpg 2x
                  "
                />
                <source
                  media="(min-width: 1440px)"
                  srcset="
                    ./img/favorites-img-desk@1x.jpg 1x,
                    ./img/favorites-img-desk@2x.jpg 2x
                  "
                />
                <img src="./img/favorites-img-mob@1x.jpg" alt="Fitness" />
              </picture>
            </li>
          </ul>
        </div>
      </div>
      <div class="favorites-second-container"></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="hero-container">
      <div class="upper-part">
        <div class="text-container">
          <svg width="38" height="38" class="text-icon">
            <use href="./img/sprite.svg#icon-sun"></use>
          </svg>
          <h1 class="hero-title">
            Get <span class="hero-title-br">Body</span> in <br />shape, Stay
            healthy
          </h1>
          <p class="hero-subtitle">
            Transform your physique and embrace a healthier lifestyle with our
            comprehensive fitness and nutrition support.
          </p>
        </div>
        <div class="small-img-container">
          <img
            class="small-img"
            src="./img/hero-second-img@1x.jpg"
            srcset="./img/hero-second-img@2x.jpg 2x"
            alt="Yoga"
            width="168"
            height="100"
          />
          <ul class="hashtags-list">
            <li class="hashtags-item">
              <p>#Sport</p>
            </li>
            <li class="hashtags-item">
              <p>#Healthy</p>
            </li>
            <li class="hashtags-item">
              <p>#Workout</p>
            </li>
            <li class="hashtags-item">
              <p>#Diet</p>
            </li>
          </ul>
        </div>
      </div>

      <div class="lower-part">
        <picture class="img-hero">
          <source
            media="(max-width: 767px)"
            srcset="./img/hero-img-mob@1x.jpg 1x, ./img/hero-img-mob@2x.jpg 2x"
          />
          <source
            media="(min-width: 768px) and (max-width: 1439px)"
            srcset="./img/hero-img-tab@1x.jpg 1x, ./img/hero-img-tab@2x.jpg 2x"
          />
          <source
            media="(min-width: 1440px)"
            srcset="
              ./img/hero-img-desk@1x.jpg 1x,
              ./img/hero-img-desk@2x.jpg 2x
            "
          />
          <img src="./img/hero-img-mob@1x.jpg" alt="Fitness" />
        </picture>
      </div>
      <div class="lower-hashtags-part">
        <ul class="hashtags-list">
          <li class="hashtags-item">
            <p>#Sport</p>
          </li>
          <li class="hashtags-item">
            <p>#Healthy</p>
          </li>
          <li class="hashtags-item">
            <p>#Workout</p>
          </li>
          <li class="hashtags-item">
            <p>#Diet</p>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>

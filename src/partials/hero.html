<section class="hero">
  <div class="container hero-container">

    <!-- Текстовий блок -->
    <div class="hero-content">
      <h1 class="hero-title">
        <svg class="icon-star" width="24" height="24">
          <use href="./img/sprite.svg#icon-star"></use>
        </svg>
        Get <span>Body</span> in shape, Stay healthy
      </h1>
      <p class="hero-text">
        Transform your physique and embrace a healthier lifestyle with our comprehensive fitness and nutrition support.
      </p>
    </div>

    <!-- Велике головне фото через <picture> з підтримкою Retina -->
    <picture class="hero-main-image">
      <source srcset="./img/hero-img-mob@1x.jpg 1x, ./img/hero-img-mob@2x.jpg 2x" media="(min-width: 320px)>
      <source srcset="./img/hero-img-tab@1x.jpg 1x, ./img/hero-img-tab@2x.jpg 2x" media="(min-width: 768px)">
      <srcset="./img/hero-img-mob@1x.jpg 1x, ./img/hero-img-mob@2x.jpg 2x">
      <img src="./img/hero-img-mob@1x.jpg" alt="Two women exercising" loading="lazy">
    </picture>

    <!-- Додатковий блок (маленьке фото + теги) -->
    <div class="hero-extra">
      <picture class="hero-small-image">
        <source srcset="./img/hero-second-img@1x.jpg 1x, ./img/hero-second-img@2x.jpg 2x">
        <img src="./img/hero-second-img@1x.jpg" alt="Fitness detail" loading="lazy">
      </picture>

      <ul class="hero-tags">
        <li class="hero-tag">#Sport</li>
        <li class="hero-tag">#Healthy</li>
        <li class="hero-tag">#Workout</li>
        <li class="hero-tag">#Diet</li>
      </ul>
    </div>

  </div>
</section>
